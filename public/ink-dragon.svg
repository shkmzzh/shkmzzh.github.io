<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMaxYMax slice">
  <defs>
    <filter id="inkBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
    <filter id="dragonShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景光晕 -->
  <ellipse cx="800" cy="600" rx="600" ry="500" fill="#000000" opacity="0.05" filter="url(#inkBlur)"/>

  <!-- 龙身主体曲线 -->
  <g filter="url(#dragonShadow)">
    <!-- 龙身躯干 -->
    <path d="M 250 500 Q 400 350 600 380 Q 800 400 1000 320 Q 1200 250 1400 350 Q 1550 420 1650 500"
          stroke="#1a1a1a" stroke-width="80" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>

    <!-- 龙头区域 -->
    <g opacity="0.95">
      <!-- 龙头主体 -->
      <ellipse cx="180" cy="480" rx="100" ry="120" fill="#1a1a1a" opacity="0.85"/>
      <ellipse cx="180" cy="480" rx="95" ry="115" fill="#2a2a2a" opacity="0.7"/>

      <!-- 龙角 -->
      <path d="M 120 350 Q 80 280 60 200" stroke="#1a1a1a" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.85"/>
      <path d="M 240 350 Q 280 280 300 200" stroke="#1a1a1a" stroke-width="18" fill="none" stroke-linecap="round" opacity="0.85"/>

      <!-- 龙眼 - 更显眼 -->
      <circle cx="150" cy="460" r="20" fill="#ffffff" opacity="0.9"/>
      <circle cx="150" cy="460" r="12" fill="#1a1a1a" opacity="0.9"/>
      <circle cx="152" cy="458" r="4" fill="#ffffff" opacity="0.95"/>

      <!-- 龙须 -->
      <path d="M 110 510 Q 40 540 0 600" stroke="#1a1a1a" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.8"/>
      <path d="M 130 530 Q 50 570 10 650" stroke="#1a1a1a" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.75"/>
      <path d="M 150 540 Q 70 590 20 680" stroke="#1a1a1a" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- 龙爪 - 前爪 -->
    <g opacity="0.85">
      <line x1="320" y1="430" x2="270" y2="380" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
      <line x1="340" y1="460" x2="295" y2="420" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
      <line x1="330" y1="500" x2="285" y2="470" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
      <line x1="310" y1="540" x2="270" y2="520" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
    </g>

    <!-- 龙爪 - 中爪 -->
    <g opacity="0.8">
      <line x1="750" y1="300" x2="710" y2="240" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
      <line x1="780" y1="320" x2="745" y2="270" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
      <line x1="760" y1="350" x2="730" y2="310" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
    </g>

    <!-- 龙爪 - 后爪 -->
    <g opacity="0.75">
      <line x1="1250" y1="280" x2="1210" y2="220" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
      <line x1="1280" y1="300" x2="1245" y2="250" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
      <line x1="1260" y1="330" x2="1230" y2="290" stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
    </g>

    <!-- 龙尾 -->
    <path d="M 1650 500 Q 1750 480 1820 400 Q 1880 320 1920 200"
          stroke="#1a1a1a" stroke-width="70" fill="none" stroke-linecap="round" opacity="0.85"/>

    <!-- 龙尾末端 -->
    <path d="M 1920 200 Q 1940 140 1960 80"
          stroke="#1a1a1a" stroke-width="50" fill="none" stroke-linecap="round" opacity="0.75"/>

    <!-- 龙鳞纹理 -->
    <g opacity="0.4" stroke="#1a1a1a" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M 350 330 Q 380 320 410 350"/>
      <path d="M 350 370 Q 380 360 410 390"/>
      <path d="M 350 410 Q 380 400 410 430"/>
      <path d="M 500 340 Q 530 330 560 360"/>
      <path d="M 500 380 Q 530 370 560 400"/>
      <path d="M 500 420 Q 530 410 560 440"/>
      <path d="M 700 280 Q 730 270 760 300"/>
      <path d="M 700 320 Q 730 310 760 340"/>
      <path d="M 900 220 Q 930 210 960 240"/>
      <path d="M 900 260 Q 930 250 960 280"/>
      <path d="M 1100 250 Q 1130 240 1160 270"/>
      <path d="M 1100 290 Q 1130 280 1160 310"/>
    </g>

    <!-- 龙的威势气雾 -->
    <g opacity="0.12">
      <circle cx="180" cy="480" r="200" fill="#000000"/>
      <circle cx="600" cy="380" r="180" fill="#000000"/>
      <circle cx="1000" cy="320" r="160" fill="#000000"/>
      <circle cx="1400" cy="350" r="150" fill="#000000"/>
    </g>

    <!-- 龙的动感线 -->
    <g opacity="0.2" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-dasharray="5,5">
      <path d="M 100 450 Q 200 350 350 400"/>
      <path d="M 200 550 Q 300 450 450 500"/>
      <path d="M 1500 200 Q 1650 150 1800 180"/>
    </g>
  </g>

  <!-- 装饰元素 -->
  <g opacity="0.08" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 50 100 Q 150 80 250 120"/>
    <path d="M 1700 950 Q 1800 980 1900 950"/>
  </g>
</svg>
