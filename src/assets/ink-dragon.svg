<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <filter id="inkFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="5" result="noise" seed="2"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="25" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <linearGradient id="dragonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.15"/>
    </linearGradient>
  </defs>

  <!-- 背景水墨效果 -->
  <g filter="url(#inkFilter)" opacity="0.15">
    <!-- 龙身主体 -->
    <path d="M 150 450 Q 250 350 380 380 Q 500 400 600 350 Q 720 300 800 340 Q 900 380 1000 320"
          stroke="#000000" stroke-width="50" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 龙头 -->
    <g>
      <ellipse cx="150" cy="450" rx="65" ry="75" fill="#000000" opacity="0.5"/>
      <path d="M 100 420 Q 80 400 70 380" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>
      <path d="M 200 420 Q 220 400 230 380" stroke="#000000" stroke-width="8" fill="none" stroke-linecap="round"/>

      <!-- 龙眼 -->
      <circle cx="130" cy="430" r="12" fill="#ffffff" opacity="0.8"/>
      <circle cx="130" cy="430" r="6" fill="#000000"/>

      <!-- 龙须 -->
      <path d="M 100 460 Q 60 480 40 520" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M 120 475 Q 70 510 50 560" stroke="#000000" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- 龙爪 - 前爪 -->
    <g opacity="0.7">
      <line x1="280" y1="380" x2="250" y2="360" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
      <line x1="290" y1="400" x2="265" y2="390" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
      <line x1="280" y1="420" x2="255" y2="420" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
      <line x1="270" y1="440" x2="250" y2="450" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- 龙爪 - 中爪 -->
    <g opacity="0.7">
      <line x1="600" y1="330" x2="580" y2="300" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
      <line x1="610" y1="350" x2="595" y2="330" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
      <line x1="600" y1="370" x2="590" y2="360" stroke="#000000" stroke-width="7" stroke-linecap="round"/>
    </g>

    <!-- 龙尾 -->
    <path d="M 1000 320 Q 1100 280 1150 200 Q 1180 140 1200 80 Q 1210 40 1220 10"
          stroke="#000000" stroke-width="42" fill="none" stroke-linecap="round"/>

    <!-- 龙鳞纹理 -->
    <g opacity="0.3" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M 250 330 Q 280 320 310 340"/>
      <path d="M 250 360 Q 280 350 310 370"/>
      <path d="M 250 390 Q 280 380 310 400"/>
      <path d="M 380 360 Q 410 350 440 370"/>
      <path d="M 380 390 Q 410 380 440 400"/>
      <path d="M 500 330 Q 530 320 560 340"/>
      <path d="M 500 360 Q 530 350 560 370"/>
      <path d="M 600 300 Q 630 290 660 310"/>
      <path d="M 720 300 Q 750 290 780 310"/>
      <path d="M 850 320 Q 880 310 910 330"/>
    </g>

    <!-- 龙威气雾 -->
    <g opacity="0.15">
      <circle cx="150" cy="450" r="120" fill="#000000"/>
      <circle cx="600" cy="350" r="100" fill="#000000"/>
      <circle cx="1000" cy="320" r="90" fill="#000000"/>
    </g>
  </g>

  <!-- 浅色装饰线 -->
  <g opacity="0.08" stroke="#000000" stroke-width="1" fill="none">
    <path d="M 50 200 Q 150 150 250 200 T 450 200"/>
    <path d="M 1100 700 Q 1200 750 1300 700 T 1500 700"/>
  </g>
</svg>
