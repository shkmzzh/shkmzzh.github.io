name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # 💡 核心修改在这里：注入了 NPM_CONFIG_ONLY_BUILT_DEPENDENCIES 环境变量
      - name: Install dependencies
        run: pnpm install
        env:
          NPM_CONFIG_ONLY_BUILT_DEPENDENCIES: "*"

      # 如果你只想精准放行那两个包，也可以用下面这一行代替上面的 "*"：
      # NPM_CONFIG_ONLY_BUILT_DEPENDENCIES: "@parcel/watcher,unrs-resolver"

      - name: Build project
        run: |
          pnpm run build
          touch out/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4