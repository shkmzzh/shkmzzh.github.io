name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 稳妥安装 Node.js 22
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 2. 全局安装 pnpm
      - name: Install pnpm
        run: npm install -g pnpm

      # 3. 💡 核心修正：直接让 pnpm 命令行自己去放行所有构建脚本，规避一切拼写和语法坑
      - name: Configure pnpm whitelist
        run: pnpm config set only-built-dependencies *

      # 4. 顺畅安装依赖，绝不会再被拦截
      - name: Install dependencies
        run: pnpm install

      # 5. 打包项目
      - name: Build project
        run: |
          pnpm run build
          touch out/.nojekyll

      # 6. 部署到 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4