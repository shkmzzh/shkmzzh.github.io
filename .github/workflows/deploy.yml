name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 允许手动触发

# 设置GITHUB_TOKEN权限
permissions:
  contents: write
  pages: write
  id-token: write

# 并发控制
concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取所有历史用于部署

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm run lint --max-warnings=0

      - name: Build project
        run: |
          pnpm run build
          touch out/.nojekyll  # 防止GitHub Pages使用Jekyll
          # 为GitHub Pages根域名仓库添加额外配置
          echo 'User-agent: *' > out/robots.txt
          echo 'Allow: /' >> out/robots.txt
          echo 'Sitemap: https://shkmzzh.github.io/sitemap.xml' >> out/robots.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './out'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment
        run: |
          echo "✅ 部署完成！"
          echo "🌐 网站地址: https://shkmzzh.github.io"
          echo "📊 GitHub Actions 状态: https://github.com/shkmzzh/shkmzzh.github.io/actions"
          echo "⏳ 如果看到404，请等待几分钟让GitHub Pages传播"
          echo "🔍 部署日志: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"